<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiplayer</title>
<style>
  body { font-family: sans-serif; margin: 0; background: #1a1a2e; color: #eee; height: 100vh; overflow: hidden; touch-action: none; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  #lobby { padding: 20px; max-width: 500px; margin: 0 auto; width: 100%; box-sizing: border-box; }
  input, button { padding: 12px; font-size: 16px; border-radius: 6px; border: none; width: 100%; margin-bottom: 10px; box-sizing: border-box; }
  input { background: #16213e; color: #eee; }
  button { background: #e94560; color: #fff; cursor: pointer; font-weight: bold; }
  button.secondary { background: #533483; }
  .room-item { background: #16213e; padding: 12px; margin: 8px 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
  .room-item button { width: auto; margin: 0; padding: 8px 16px; }
  #game { display: none; flex: 1; position: relative; flex-direction: column; min-height: 0; }
  #field { flex: 1; position: relative; background: #16213e; overflow: hidden; touch-action: none; }
  .player-dot { position: absolute; width: 40px; height: 40px; border-radius: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff; border: 2px solid #fff; transition: all 0.1s; }
  #topbar { padding: 10px; background: #0f0f1e; display: flex; justify-content: space-between; align-items: center; }
  #topbar button { width: auto; margin: 0; padding: 6px 12px; }
  #chat { height: 150px; background: #0f0f1e; display: flex; flex-direction: column; border-top: 1px solid #333; }
  #chat-messages { flex: 1; overflow-y: auto; padding: 8px; font-size: 14px; }
  #chat-input-row { display: flex; padding: 6px; gap: 6px; }
  #chat-input-row input { margin: 0; }
  #chat-input-row button { margin: 0; width: auto; padding: 0 16px; }
</style>
</head>
<body>
<div id="app">
  <div id="lobby">
    <h2>Multiplayer</h2>
    <input id="nickname" placeholder="Your name" value="Player">
    <button onclick="createRoom()">Create Room</button>
    <button class="secondary" onclick="loadRooms()">Refresh Rooms</button>
    <div id="error-box" style="color: #ff5555; margin-top: 10px; font-weight: bold;"></div>
    <div id="rooms-list" style="margin-top:20px"></div>
  </div>
  <div id="game">
    <div id="topbar">
      <span id="room-info">Room</span>
      <button class="secondary" onclick="leaveRoom()">Leave</button>
    </div>
    <div id="field"></div>
    <div id="chat">
      <div id="chat-messages"></div>
      <div id="chat-input-row">
        <input id="chat-input" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase = supabase.createClient(
  'https://swzpbwvgrxesbaalkmie.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3enBid3Zncnhlc2JhYWxrbWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5NzMzNzYsImV4cCI6MjEwNzU0OTM3Nn0.AW9Rg1fg-jP6MwRkLTYCc7bg9UfEL8g-an68DlOyP-Y'
);

let MY_ID = localStorage.getItem('player_id');
if (!MY_ID) {
  MY_ID = Math.random().toString(36).substring(2, 15);
  localStorage.setItem('player_id', MY_ID);
}

let currentRoom = null;
let channel = null;
let playersMap = new Map();
let myNickname = 'Player';
let myColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');

async function loadRooms() {
  const { data, error } = await supabase.from('rooms').select('*').order('created_at', { ascending: false });
  if (error) { document.getElementById('error-box').innerText = 'Ошибка загрузки: ' + error.message; return; }
  const list = document.getElementById('rooms-list');if (!data || data.length === 0) { list.innerHTML = '<p style="color:#888">Комнат нет. Создай первую!</p>'; return; }
  list.innerHTML = data.map(r => `
    <div class="room-item">
      <span>${escapeHtml(r.name)}</span>
      <button onclick="joinRoom('${r.id}')">Join</button>
    </div>
  `).join('');
}
window.loadRooms = loadRooms;

async function createRoom() {
  document.getElementById('error-box').innerText = 'Создаем...';
  myNickname = document.getElementById('nickname').value.trim() || 'Player';
  const { data, error } = await supabase.from('rooms').insert({ name: 'Room', host_id: MY_ID }).select().single();
  if (error) { document.getElementById('error-box').innerText = 'ОШИБКА БД: ' + error.message; return; }
  document.getElementById('error-box').innerText = '';
  joinRoom(data.id);
}
window.createRoom = createRoom;

async function joinRoom(roomId) {
  myNickname = document.getElementById('nickname').value.trim() || 'Player';
  const { data: room } = await supabase.from('rooms').select('*').eq('id', roomId).single();
  if (!room) { alert('Комната не найдена'); return; }
  currentRoom = room;

  const { error: errPl } = await supabase.from('players').upsert({ room_id: roomId, user_id: MY_ID, nickname: myNickname, color: myColor }, { onConflict: 'room_id,user_id' });
  if (errPl) { document.getElementById('error-box').innerText = 'ОШИБКА ИГРОКА: ' + errPl.message; return; }

  document.getElementById('lobby').style.display = 'none';
  document.getElementById('game').style.display = 'flex';
  document.getElementById('room-info').textContent = 'Room | You: ' + myNickname;

  await loadPlayers();
  subscribeRealtime(roomId);
}
window.joinRoom = joinRoom;

async function loadPlayers() {
  if (!currentRoom) return;
  const { data } = await supabase.from('players').select('*').eq('room_id', currentRoom.id);
  if (!data) return;
  playersMap.clear();
  data.forEach(p => playersMap.set(p.user_id, p));
  renderPlayers();
}

function renderPlayers() {
  const field = document.getElementById('field');
  const rect = field.getBoundingClientRect();
  for (const [uid, p] of playersMap) {
    let el = document.getElementById('dot-' + uid);
    if (!el) {
      el = document.createElement('div');
      el.id = 'dot-' + uid;
      el.className = 'player-dot';
      el.style.background = p.color;
      field.appendChild(el);
    }
    el.textContent = p.nickname;
    el.style.left = (p.x * rect.width) + 'px';
    el.style.top = (p.y * rect.height) + 'px';
  }
  for (const el of field.querySelectorAll('.player-dot')) {
    const uid = el.id.replace('dot-', '');
    if (!playersMap.has(uid)) el.remove();
  }
}

function subscribeRealtime(roomId) {
  channel = supabase.channel('room-' + roomId);
  channel.on('postgres_changes', { event: '*', schema: 'public', table: 'players', filter: `room_id=eq.${roomId}` }, () => loadPlayers());
  channel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${roomId}` }, (payload) => addChatMessage(payload.new));
  channel.subscribe((status) => { if (status === 'SUBSCRIBED') loadMessages(); });
}

async function loadMessages() {
  if (!currentRoom) return;
  const { data } = await supabase.from('messages').select('*').eq('room_id', currentRoom.id).order('created_at', { ascending: true }).limit(50);
  document.getElementById('chat-messages').innerHTML = '';
  (data || []).forEach(addChatMessage);
}

function addChatMessage(m) {
  const box = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.innerHTML = `<b>${escapeHtml(m.nickname || '?')}:</b> ${escapeHtml(m.text)}`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
  if (!currentRoom) return;
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';await supabase.from('messages').insert({ room_id: currentRoom.id, user_id: MY_ID, nickname: myNickname, text: text });
}
window.sendMessage = sendMessage;

const field = document.getElementById('field');
let throttleTimer = null;

function handleMove(clientX, clientY) {
  if (!currentRoom) return;
  if (throttleTimer) return;
  throttleTimer = setTimeout(() => throttleTimer = null, 60);
  const rect = field.getBoundingClientRect();
  const x = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  const y = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
  supabase.from('players').update({ x: x, y: y }).eq('room_id', currentRoom.id).eq('user_id', MY_ID);
}

field.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
field.addEventListener('touchmove', e => {
  if (e.touches.length > 0) handleMove(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });

async function leaveRoom() {
  if (currentRoom) {
    await supabase.from('players').delete().eq('room_id', currentRoom.id).eq('user_id', MY_ID);
  }
  if (channel) await supabase.removeChannel(channel);
  channel = null; currentRoom = null;
  playersMap.clear();
  document.getElementById('field').innerHTML = '';
  document.getElementById('chat-messages').innerHTML = '';
  document.getElementById('game').style.display = 'none';
  document.getElementById('lobby').style.display = 'block';
  loadRooms();
}
window.leaveRoom = leaveRoom;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadRooms();
</script>
</body>
</html>
